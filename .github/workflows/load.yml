name: Load Data from Neon to BigQuery

on:
  workflow_dispatch:

jobs:
  load-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL script
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ' inzyniera-danych-wosiak-smol'       # <-- Wpisz swoje ID projektu z BigQuery
          DATASET: 'game_store_data'              # <-- Wpisz nazwę datasetu z Kroku 9
          TABLE: 'publishers'                      # <-- Na pierwszy test np. 'publishers'
        run: python main.py
